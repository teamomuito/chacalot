name: Build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chacalot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # The app's update checker reads the latest release; tag number == versionCode.
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk chacalot.apk
          gh release create "v$GITHUB_RUN_NUMBER" chacalot.apk --target "$GITHUB_SHA" --title "Build $GITHUB_RUN_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
